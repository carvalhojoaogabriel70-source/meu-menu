<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>XD Interface BG</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            width: 1360px; height: 768px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu {
            width: 1100px; height: 650px;
            background: #08080c;
            border: 1px solid rgba(168, 85, 247, 0.12);
            border-radius: 14px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,0.85), 0 0 40px rgba(168,85,247,0.05);
            position: relative;
        }
        .sidebar {
            width: 200px;
            background: rgba(5, 5, 8, 0.85);
            border-right: 1px solid rgba(168, 85, 247, 0.12);
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            text-align: center;
            margin-bottom: 30px;
        }
        .logo .xd {
            font-size: 28px; font-weight: 900; font-style: italic;
            background: linear-gradient(135deg, #fff 40%, #a855f7 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo .label {
            font-size: 10px; font-weight: 700; color: #a855f7;
            letter-spacing: 2px;
        }
        .tab-label {
            color: #64748b;
            font-size: 12px; font-weight: 600;
            padding: 10px 12px;
            border-left: 3px solid transparent;
            font-family: 'Space Grotesk', sans-serif;
        }
        .content {
            flex: 1;
            background: linear-gradient(180deg, rgba(8,8,12,0.9) 0%, rgba(4,4,6,0.98) 100%);
        }
        .footer {
            position: absolute;
            bottom: 12px; left: 220px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 10px; color: #64748b;
            font-family: 'Space Grotesk', sans-serif;
        }
        .footer .dot {
            width: 5px; height: 5px;
            background: #10b981; border-radius: 50%;
            display: inline-block; margin-right: 6px;
            box-shadow: 0 0 6px #10b981;
        }
        .glow-tl {
            position: absolute; top: 0; left: 0;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(168,85,247,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .glow-br {
            position: absolute; bottom: 0; right: 0;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(168,85,247,0.05) 0%, transparent 70%);
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="menu">
    <div class="glow-tl"></div>
    <div class="glow-br"></div>
    <aside class="sidebar">
        <div class="logo">
            <div class="xd">XD</div>
            <div class="label">INTERFACE</div>
        </div>
        <div class="tab-label">Self</div>
        <div class="tab-label">World</div>
        <div class="tab-label">Vehicle</div>
        <div class="tab-label">Vehicles</div>
        <div class="tab-label">Weapon</div>
        <div class="tab-label">Aim</div>
        <div class="tab-label">Visual</div>
    </aside>
    <div class="content"></div>
    <div class="footer">
        <span><span class="dot"></span>Conectado | XD Premium</span>
        <span>Status: Indetectado</span>
    </div>
</div>
</body>
</html>
